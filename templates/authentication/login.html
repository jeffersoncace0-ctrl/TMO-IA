<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Enterprise Core</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-body: #F4F7FC;
            --bg-sidebar: #070D18;
            --surface-card: #FFFFFF;
            --border-card: #E2E8F0;
            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #475569;
            --brand-primary: #1D68FE;
            --brand-gradient: linear-gradient(90deg, #1D68FE 0%, #0099FF 100%);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 95% 5%, rgba(29, 104, 254, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 10% 90%, rgba(0, 153, 255, 0.04) 0%, transparent 50%);
            padding: 1.5rem;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid var(--border-card);
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .brand-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1D68FE 0%, #0099FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
            margin: 0 auto 1rem auto;
        }

        .form-control {
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            transition: all 180ms ease;
            background-color: #F8FAFC;
        }

        .form-control:focus {
            background-color: #FFFFFF;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(29, 104, 254, 0.15);
        }

        .btn-submit {
            background: var(--brand-gradient);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: none;
            width: 100%;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
            transition: all 180ms ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18);
            transform: translateY(-1px);
        }

        .demo-callout {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 1.15rem 1.35rem;
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-badge">
                <i class="bi bi-box"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1" style="font-size: 1.45rem; letter-spacing: -0.02em;">Enterprise Core</h3>
            <p class="text-muted small mb-0">Inicie sesión para acceder a la suite de analítica</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3" style="font-size: 0.825rem;">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Credenciales inválidas. Compruebe usuario y contraseña.
            </div>
        {% endif %}

        <form method="post" action="{% url 'authentication:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label small fw-semibold text-dark mb-1">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted" style="border-color: #CBD5E1; border-radius: 10px 0 0 10px;">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control border-start-0" id="id_username" placeholder="admin" required autofocus style="border-radius: 0 10px 10px 0;">
                </div>
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label small fw-semibold text-dark mb-1">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted" style="border-color: #CBD5E1; border-radius: 10px 0 0 10px;">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-start-0" id="id_password" placeholder="••••••••••••" required style="border-radius: 0 10px 10px 0;">
                </div>
            </div>

            <button type="submit" class="btn btn-submit mt-2 mb-3">
                <span>Ingresar al Sistema</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="demo-callout mb-3">
            <div class="d-flex align-items-center gap-2 mb-1">
                <i class="bi bi-info-circle-fill text-primary" style="font-size: 0.85rem;"></i>
                <span class="fw-bold text-dark small" style="font-size: 0.78rem;">Credenciales de Prueba:</span>
            </div>
            <div class="small text-secondary" style="font-size: 0.76rem; font-family: monospace;">
                Usuario: <span class="fw-bold text-dark">admin</span> | Clave: <span class="fw-bold text-dark">adminpassword2026</span>
            </div>
        </div>

        <div class="text-center pt-2 border-top">
            <a href="{% url 'core:landing' %}" class="text-decoration-none small text-muted d-inline-flex align-items-center gap-1">
                <i class="bi bi-arrow-left"></i>
                <span>Volver a la Pantalla Principal</span>
            </a>
        </div>
    </div>
</body>
</html>
